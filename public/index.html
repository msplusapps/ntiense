<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Chat Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 500: '#6366f1', 600: '#4f46e5' },
            secondary: { 500: '#8b5cf6', 600: '#7c3aed' }
          }
        }
      }
    };
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md">
    <div id="chat-popup"
      class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl overflow-hidden transition-all duration-300">

      <!-- Header -->
      <div class="bg-primary-500 text-white p-4 flex justify-between items-center">
        <h2 class="font-bold text-lg flex items-center gap-2">
          <i data-feather="message-square"></i>
          Admin Support
        </h2>
        <div class="flex items-center gap-3">
          <button id="theme-toggle" class="text-white hover:text-gray-200 transition">
            <i data-feather="moon" class="hidden dark:block"></i>
            <i data-feather="sun" class="dark:hidden"></i>
          </button>
          <button id="close-btn" class="text-white hover:text-gray-200 transition">
            <i data-feather="x"></i>
          </button>
        </div>
      </div>

      <!-- Chat Area -->
      <div id="chat-container" class="h-96 flex flex-col">
        <div id="chat-header" class="border-b dark:border-gray-700 p-3 flex items-center gap-3">
          <div class="relative">
            <div class="w-10 h-10 rounded-full bg-secondary-500 flex items-center justify-center text-white">
              <i data-feather="user"></i>
            </div>
            <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white dark:border-gray-800"></span>
          </div>
          <div>
            <h3 class="font-semibold text-gray-800 dark:text-white">Support Agent</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400">Online</p>
          </div>
        </div>

        <!-- Messages -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
          <div class="flex justify-start">
            <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3 max-w-xs">
              <p class="text-gray-800 dark:text-gray-200">👋 Welcome! Monitoring active chats...</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 text-right mt-1">
                <span id="welcome-time"></span>
              </p>
            </div>
          </div>
        </div>

        <!-- Input -->
        <div class="border-t dark:border-gray-700 p-3">
          <div class="flex items-center gap-2">
            <input id="chat-input" type="text" placeholder="Type your message..."
              class="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500" />
            <button id="send-btn" class="p-2 text-white bg-primary-500 hover:bg-primary-600 rounded-full transition">
              <i data-feather="send"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    feather.replace();

    // Show current time
    document.getElementById("welcome-time").innerText = new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
    });

    const SERVER_URL = "http://192.168.0.132:5555";
    const chatMessages = $("#chat-messages");
    const chatInput = $("#chat-input");
    const sendBtn = $("#send-btn");
    const socket = io(SERVER_URL);

    // =========================
    // 🔐 CONNECT AS ADMIN
    // =========================
    const token = localStorage.getItem("adminToken");
    if (!token) {
      alert("Session expired. Please log in again.");
      window.location.href = "/admin-login.html";
    }

    socket.on("connect", () => {
      console.log("✅ Connected to server");
      socket.emit("adminConnect", { token });
    });

    socket.on("adminConnected", (data) => {
      console.log(data.message);
    });

    // =========================
    // 🔔 USER LOGIN NOTIFY
    // =========================
    socket.on("userConnected", (data) => {
      chatMessages.append(`
        <div class="flex justify-start">
          <div class="bg-green-100 dark:bg-green-800 rounded-lg p-3 max-w-xs">
            <p class="text-green-700 dark:text-green-200 font-semibold">👤 ${data.username} just logged in.</p>
            <p class="text-xs text-green-600 dark:text-green-300 text-right mt-1">
              ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </p>
          </div>
        </div>
      `);
      chatMessages.scrollTop(chatMessages[0].scrollHeight);
    });

    // =========================
    // 📩 RECEIVE MESSAGE
    // =========================
    socket.on("messageFromUser", (data) => {
      chatMessages.append(`
        <div class="flex justify-start">
          <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3 max-w-xs">
            <p class="text-gray-800 dark:text-gray-200">
              <strong>${data.sender}:</strong> ${data.message}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400 text-right mt-1">
              ${new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </p>
          </div>
        </div>
      `);
      chatMessages.scrollTop(chatMessages[0].scrollHeight);
    });

    // =========================
    // 💬 SEND MESSAGE
    // =========================
    function sendMessage() {
      const message = chatInput.val().trim();
      if (!message) return;

      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      chatMessages.append(`
        <div class="flex justify-end">
          <div class="bg-primary-500 text-white rounded-lg p-3 max-w-xs">
            <p>${message}</p>
            <p class="text-xs text-primary-100 text-right mt-1">${time}</p>
          </div>
        </div>
      `);
      chatMessages.scrollTop(chatMessages[0].scrollHeight);
      chatInput.val("");

      // ✅ Send message globally or to connected users
      socket.emit("adminMessage", { message, token });
    }

    sendBtn.on("click", sendMessage);
    chatInput.on("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    // =========================
    // 🌙 THEME TOGGLE
    // =========================
    const themeToggle = $("#theme-toggle");
    themeToggle.on("click", () => {
      $("html").toggleClass("dark");
    });
  </script>
</body>
</html>
