<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Chat Support</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#6366f1', 600: '#4f46e5' },
                        secondary: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md">
        <div id="chat-popup"
            class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl overflow-hidden transition-all duration-300 transform translate-y-0 opacity-100">

            <!-- Header -->
            <div class="bg-primary-500 text-white p-4 flex justify-between items-center">
                <h2 class="font-bold text-lg flex items-center gap-2">
                    <i data-feather="message-square"></i>
                    Admin Support
                </h2>
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="text-white hover:text-gray-200 transition">
                        <i data-feather="moon" class="hidden dark:block"></i>
                        <i data-feather="sun" class="dark:hidden"></i>
                    </button>
                    <button id="minimize-btn" class="text-white hover:text-gray-200 transition">
                        <i data-feather="minus"></i>
                    </button>
                    <button id="close-btn" class="text-white hover:text-gray-200 transition">
                        <i data-feather="x"></i>
                    </button>
                </div>
            </div>

            <!-- Chat Area -->
            <div id="chat-container" class="h-96 flex flex-col">
                <div id="chat-header" class="border-b dark:border-gray-700 p-3 flex items-center gap-3">
                    <div class="relative">
                        <div
                            class="w-10 h-10 rounded-full bg-secondary-500 flex items-center justify-center text-white">
                            <i data-feather="user"></i>
                        </div>
                        <span
                            class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white dark:border-gray-800"></span>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-800 dark:text-white">Support Agent</h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Online</p>
                    </div>
                </div>

                <!-- Messages -->
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <div class="flex justify-start">
                        <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3 max-w-xs">
                            <p class="text-gray-800 dark:text-gray-200">👋 Welcome! How can I assist you today?</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400 text-right mt-1">
                                <span id="welcome-time"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Input -->
                <div class="border-t dark:border-gray-700 p-3">
                    <div class="flex items-center gap-2">
                        <button
                            class="p-2 text-gray-500 dark:text-gray-400 hover:text-primary-500 dark:hover:text-primary-400 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <i data-feather="paperclip"></i>
                        </button>
                        <input id="chat-input" type="text" placeholder="Type your message..."
                            class="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <button id="send-btn"
                            class="p-2 text-white bg-primary-500 hover:bg-primary-600 rounded-full transition">
                            <i data-feather="send"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Minimized chat -->
        <div id="minimized-chat"
            class="hidden fixed bottom-4 right-4 bg-primary-500 text-white rounded-full p-3 shadow-lg cursor-pointer hover:bg-primary-600 transition">
            <i data-feather="message-square"></i>
        </div>
    </div>

    <script>
        feather.replace();

        // Add current time to welcome message
        document.getElementById('welcome-time').innerText =
            new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        // Function to send message
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Add user message bubble
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex justify-end';
            messageDiv.innerHTML = `
                <div class="bg-primary-500 text-white rounded-lg p-3 max-w-xs">
                    <p>${message}</p>
                    <p class="text-xs text-primary-100 text-right mt-1">${time}</p>
                </div>
            `;

            chatMessages.appendChild(messageDiv);
            chatInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // (Optional) Simulate a short auto-reply
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'flex justify-start';
                replyDiv.innerHTML = `
                    <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3 max-w-xs">
                        <p class="text-gray-800 dark:text-gray-200">Thanks for your message! An agent will reply soon.</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400 text-right mt-1">${time}</p>
                    </div>
                `;
                chatMessages.appendChild(replyDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
        }

        // Send on button click
        sendBtn.addEventListener('click', sendMessage);

        // Send on Enter key
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
